<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#080c0a;--deep:#0f1710;--panel:#141f16;--panel2:#1a2b1d;
  --border:rgba(255,255,255,0.08);--trail:#39e87a;--trail-dim:rgba(57,232,122,0.10);
  --trail-mid:rgba(57,232,122,0.35);--muted:rgba(255,255,255,0.38);
  --silver:#c8d4cc;--white:#ffffff;--red:#f05c5c;--amber:#f0a832;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--void);color:var(--white);min-height:100vh}
#root{min-height:100vh;display:flex;flex-direction:column}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.6)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes scanLine{0%{top:-10%}100%{top:110%}}
@keyframes ringPulse{0%{transform:scale(0.8);opacity:0}50%{opacity:0.4}100%{transform:scale(1.6);opacity:0}}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--trail);animation:pulse 1.8s infinite;display:inline-block}
::-webkit-scrollbar{width:0;height:0}
</style>

function Label({children}){
  return e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.58rem",color:"var(--trail)",letterSpacing:"0.14em",marginBottom:"0.65rem"}},children);
}
function Card({children,style={},highlight=false}){
  return e('div',{style:{background:highlight?"rgba(57,232,122,0.05)":"var(--panel)",border:`1px solid ${highlight?"var(--trail-mid)":"var(--border)"}`,borderRadius:8,...style}},children);
}

// ---- SPLASH SCREEN ----
function Splash({onDone}){
  const [phase,setPhase]=useState(0);
  // phase 0: initial, phase 1: scanning, phase 2: authenticated, phase 3: fading out

  useEffect(()=>{
    const t1=setTimeout(()=>setPhase(1),300);
    const t2=setTimeout(()=>setPhase(2),1400);
    const t3=setTimeout(()=>setPhase(3),2200);
    const t4=setTimeout(()=>onDone(),2700);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4);}
  },[]);

  return e('div',{style:{
    minHeight:"100vh",background:"var(--void)",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",padding:"2rem",textAlign:"center",
    position:"fixed",inset:0,zIndex:999,
    opacity:phase===3?0:1,
    transition:"opacity 0.5s ease",
  }},
    // Grid overlay
    e('div',{style:{position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(57,232,122,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(57,232,122,0.03) 1px,transparent 1px)",backgroundSize:"50px 50px",pointerEvents:"none"}}),

    // Rings
    phase>=1&&e('div',{style:{position:"absolute",width:220,height:220,borderRadius:"50%",border:"1px solid rgba(57,232,122,0.2)",animation:"ringPulse 1.2s ease-out forwards"}}),
    phase>=1&&e('div',{style:{position:"absolute",width:160,height:160,borderRadius:"50%",border:"1px solid rgba(57,232,122,0.3)",animation:"ringPulse 1.2s ease-out 0.15s forwards"}}),

    // Logo
    e('div',{style:{position:"relative",zIndex:2,animation:"fadeIn 0.5s ease forwards"}},
      e('div',{style:{fontSize:"3.5rem",marginBottom:"1.2rem",filter:"drop-shadow(0 0 20px rgba(57,232,122,0.3))"}}, "🕶️"),
      e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.9rem",letterSpacing:"-0.04em",marginBottom:"0.2rem"}},
        "rewrapped",e('span',{style:{color:"var(--trail)"}}," trail")
      ),
      e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.6rem",color:"var(--muted)",letterSpacing:"0.18em",marginBottom:"2.5rem"}},
        phase<2?"AUTHENTICATING PAIR...":"PAIR AUTHENTICATED"
      ),

      // Status line
      e('div',{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"0.6rem"}},
        phase<2
          ? e('div',{style:{display:"flex",gap:"0.4rem"}},
              [0,1,2].map(i=>e('div',{key:i,style:{width:6,height:6,borderRadius:"50%",background:"var(--trail)",animation:`pulse 1s ease-in-out ${i*0.2}s infinite`}}))
            )
          : e('div',{style:{display:"flex",alignItems:"center",gap:"0.5rem",color:"var(--trail)",animation:"fadeIn 0.4s ease forwards"}},
              e('div',{style:{fontSize:"1rem"}},"✓"),
              e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.65rem",letterSpacing:"0.1em"}},"WELCOME BACK")
            )
      )
    )
  );
}

// ---- DASHBOARD ----

        e('div',{style:{width:52,height:52,borderRadius:"50%",border:"2px solid var(--trail-mid)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.4rem",flexShrink:0}},pair.avatar),
        e('div',{style:{flex:1}},
          e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1.1rem",letterSpacing:"-0.02em"}},pair.name),
          e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.58rem",color:"var(--muted)",marginTop:"0.15rem",letterSpacing:"0.07em"}},pair.city)
        ),
        e('div',{style:{textAlign:"right"}},
          e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.6rem",color:"var(--trail)",lineHeight:1}},pair.rank),
          e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.5rem",color:"var(--muted)",letterSpacing:"0.08em"}},"GLOBAL RANK")
        )
      )
    ),
    e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.5rem"}},
      [["♻️",pair.plastic,"plastic diverted"],["🌱",pair.co2,"CO₂ saved"],["🏃",pair.weeklyKm+"km","this week"]].map(([icon,val,label])=>
        e(Card,{key:label,style:{padding:"0.85rem 0.6rem",textAlign:"center"}},
          e('div',{style:{fontSize:"1rem",marginBottom:"0.25rem"}},icon),
          e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1rem",color:"var(--trail)"}},val),
          e('div',{style:{fontSize:"0.58rem",color:"var(--muted)",marginTop:"0.1rem",lineHeight:1.3}},label)
        )
      )
    ),
    e(Label,{},"SMARTTAP FEATURES"),
    e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5rem"}},
      [
        {id:"travel",icon:"✈️",title:"TravelReady",sub:"Open "+pair.travel.app},
        {id:"impact",icon:"🌍",title:"Impact Passport",sub:"Your sustainability report"},
        {id:"story",icon:"🎬",title:"My Story",sub:"Meet "+pair.picker.name.split(" ")[0]},
        {id:"sos",icon:"🚨",title:"SOS Profile",sub:"Blood: "+pair.sos.blood},
      ].map(t=>

          e('div',{style:{fontSize:"0.8rem",fontWeight:600}},t.title),
          e('div',{style:{fontSize:"0.62rem",color:"var(--muted)",marginTop:"0.2rem",lineHeight:1.4}},t.sub),
          e('div',{style:{position:"absolute",bottom:"0.7rem",right:"0.7rem",fontSize:"0.65rem",color:"var(--trail)",opacity:0.6}},"→")
        )
      )
    )
  );

// ---- LEADERBOARD ----
function Leaderboard({currentId}){
  const posEmoji=p=>p===1?"🥇":p===2?"🥈":p===3?"🥉":p;
  const posColor=p=>p===1?"var(--amber)":p===2?"#b0bec5":p===3?"#cd7f32":"var(--muted)";
  return e('div',{style:{display:"flex",flexDirection:"column",gap:"0.5rem"}},
    e(Label,{},"THIS WEEK — GLOBAL"),
    LEADERBOARD.map(row=>{
      const isMe=row.id===currentId;
      return e('div',{key:row.pos,style:{background:isMe?"rgba(57,232,122,0.05)":"var(--panel)",border:`1px solid ${isMe?"var(--trail-mid)":"var(--border)"}`,borderRadius:8,padding:"0.75rem 0.9rem",display:"grid",gridTemplateColumns:"1.8rem auto 1fr auto",alignItems:"center",gap:"0.6rem"}},
        e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.72rem",fontWeight:700,color:posColor(row.pos),textAlign:"center"}},posEmoji(row.pos)),
        e('div',{style:{fontSize:"0.95rem"}},row.flag),
        e('div',{},
          e('div',{style:{fontSize:"0.82rem",fontWeight:500}},row.name,isMe&&e('span',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.52rem",color:"var(--trail)",marginLeft:"0.3rem"}}," YOU")),
          e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.53rem",color:"var(--muted)",marginTop:"0.1rem",letterSpacing:"0.05em"}},row.city)
        ),
        e('div',{style:{textAlign:"right"}},
          e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.78rem",fontWeight:700,color:"var(--trail)"}},row.km+" km"),
          e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.55rem",color:"var(--muted)",marginTop:"0.1rem"}},row.hrs)
        )
      );
    })
  );
}

// ---- AI TRAVEL AGENT ----
function TravelAgent({onTripSaved,savedTrip}) {
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);

  function parseTrip() {
    if(!input.trim()) return;
    setLoading(true);
    setError(null);
    
    try {
      const text = input;
      const result = {};

      // Flight number — catches 6E-204, 6E204, AI-101, SG 456 etc
      const flightMatch = text.match(/(6E|AI|SG|UK|QP|IX|G8|I5|9W|EK|QR)[- ]?(\d{2,4})/i);
      if(flightMatch) {
        result.flightNumber = (flightMatch[1]+flightMatch[2]).toUpperCase();
      } else {
        const generic = text.match(/([A-Z]{2}\d{3,4})/i);
        result.flightNumber = generic ? generic[1].toUpperCase() : null;
      }

      // Airline detection
      if(/indigo|6e.?\d/i.test(text)) result.airline = "IndiGo";
      else if(/air.?india|AI.?\d/i.test(text)) result.airline = "Air India";
      else if(/spicejet|SG.?\d/i.test(text)) result.airline = "SpiceJet";
      else if(/vistara|UK.?\d/i.test(text)) result.airline = "Vistara";
      else if(/akasa|QP.?\d/i.test(text)) result.airline = "Akasa";
      else result.airline = null;

      // Cities — "X to Y" pattern
      const toMatch = text.match(/(?:fly(?:ing)?|flight|from|travelling?)\s+([A-Za-z\s]+?)\s+to\s+([A-Za-z\s]+?)(?:\s+on|\s+at|\s*[,.]|$)/i);
      if(toMatch) {
        result.flightFrom = toMatch[1].trim();
        result.flightTo = toMatch[2].trim();
        result.destination = toMatch[2].trim();
      } else {
        // fallback: just "X to Y"
        const simple = text.match(/([A-Za-z]+)\s+to\s+([A-Za-z]+)/i);
        if(simple) { result.flightFrom = simple[1]; result.flightTo = simple[2]; result.destination = simple[2]; }
      }

      // Bus route
      const busMatch = text.match(/bus\s+(?:from\s+)?([A-Za-z]+)\s+to\s+([A-Za-z]+)/i);
      if(busMatch) { result.busFrom = busMatch[1]; result.busTo = busMatch[2]; }

      // PNR
      const pnrMatch = text.match(/pnr\s*[:#]?\s*([A-Z0-9]{6,10})/i);
      result.trainPnr = pnrMatch ? pnrMatch[1].toUpperCase() : null;

      // Train from/to
      const trainMatch = text.match(/train\s+(?:from\s+)?([A-Za-z\s]+?)\s+to\s+([A-Za-z\s]+?)(?:\s+on|\s*[,.]|$)/i);
      if(trainMatch) { result.trainFrom = trainMatch[1].trim(); result.trainTo = trainMatch[2].trim(); }

      // Hotel
      const hotelMatch = text.match(/(?:staying?\s+at|hotel|inn|lodge|resort|taj|marriott|hilton|hyatt|oberoi)\s+([A-Za-z\s,]+?)(?:\.|,|$)/i);
      result.hotel = hotelMatch ? hotelMatch[0].replace(/staying?\s+at\s+/i,"").trim() : null;

      // Destination override — hotel location or explicit destination
      const destMatch = text.match(/(?:going to|visiting|destination[:\s]+|arriving\s+(?:at|in)\s+)([A-Za-z\s]+?)(?:\s+on|\s*[,.]|$)/i);
      if(destMatch && !result.destination) result.destination = destMatch[1].trim();
      if(result.hotel) result.destination = result.hotel;

      // Date extraction — "25th July", "July 25", "25/07"
      const dateMatch = text.match(/(\d{1,2}(?:st|nd|rd|th)?\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:\s+\d{4})?|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);
      result.flightDate = dateMatch ? dateMatch[0] : null;

      // Summary
      const parts = [];
      if(result.airline && result.flightNumber) parts.push(`${result.airline} ${result.flightNumber}`);
      if(result.flightFrom && result.flightTo) parts.push(`${result.flightFrom} → ${result.flightTo}`);
      if(result.flightDate) parts.push(`on ${result.flightDate}`);
      if(result.busFrom) parts.push(`+ bus to ${result.busTo||"destination"}`);
      if(result.hotel) parts.push(`· ${result.hotel}`);
      result.summary = parts.length > 0 ? parts.join(" ") : "Trip saved";

      if(!result.flightFrom && !result.destination && !result.busFrom && !result.trainPnr) {
        setError("Couldn't find trip details. Mention cities, flight number, or hotel name.");
        setLoading(false);
        return;
      }

      onTripSaved(result);
    } catch(err) {
      setError("Something went wrong. Try again.");
    }
    setLoading(false);
  }

  return e('div',{style:{display:"flex",flexDirection:"column",gap:"0.75rem"}},
    e('div',{style:{background:"linear-gradient(135deg,#1a2b1d,rgba(57,232,122,0.08))",border:"1px solid var(--border)",borderRadius:8,padding:"1rem"}},
      e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.1rem",marginBottom:"0.3rem"}},"🤖 AI Travel Agent"),
      e('div',{style:{fontSize:"0.75rem",color:"var(--muted)",lineHeight:1.6}},"Tell me your travel plans in plain English. I'll set up your TravelReady dashboard automatically.")
    ),
    savedTrip&&e('div',{style:{background:"rgba(57,232,122,0.08)",border:"1px solid var(--trail-mid)",borderRadius:8,padding:"0.9rem 1rem"}},
      e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.55rem",color:"var(--trail)",letterSpacing:"0.1em",marginBottom:"0.4rem"}},"ACTIVE TRIP"),
      e('div',{style:{fontSize:"0.82rem",fontWeight:500}},savedTrip.summary),
      e('div',{onClick:()=>onTripSaved(null),style:{fontFamily:"'Space Mono',monospace",fontSize:"0.55rem",color:"var(--muted)",marginTop:"0.4rem",cursor:"pointer"}})
    ),
    e('div',{style:{position:"relative"}},
      e('textarea',{
        value:input,
        onChange:ev=>setInput(ev.target.value),
        placeholder:"e.g. Flying Delhi to Mumbai on 25th July, IndiGo 6E-204. Then train to Pune on 26th, PNR 4875663. Staying at Taj Lands End.",
        style:{
          width:"100%",minHeight:100,background:"var(--deep)",border:"1px solid var(--border)",
          borderRadius:8,padding:"0.85rem",color:"var(--white)",fontSize:"0.82rem",
          fontFamily:"'DM Sans',sans-serif",lineHeight:1.6,resize:"none",outline:"none",
        }
      })
    ),
    error&&e('div',{style:{fontSize:"0.75rem",color:"var(--red)",padding:"0.5rem 0"}},error),
    e('div',{onClick:()=>parseTrip(),style:{
      background:loading?"rgba(57,232,122,0.3)":"var(--trail)",color:"var(--void)",
      borderRadius:6,padding:"0.8rem",fontWeight:700,fontSize:"0.82rem",
      cursor:loading?"not-allowed":"pointer",textAlign:"center",
      display:"flex",alignItems:"center",justifyContent:"center",gap:"0.5rem"
    }},
      loading&&e('div',{style:{display:"flex",gap:"0.3rem"}},
        [0,1,2].map(i=>e('div',{key:i,style:{width:5,height:5,borderRadius:"50%",background:"var(--void)",animation:`pulse 1s ease-in-out ${i*0.2}s infinite`}}))
      ),
      loading?"Parsing your trip...":"Set Up My Trip ✦"
    )
  );
}

function Documents({pairId}) {
  const storageKey = "rwdocs_"+pairId;
  const [docs, setDocs] = useState(()=>{
    try { return JSON.parse(localStorage.getItem(storageKey)||"{}"); }
    catch{ return {}; }
  });
  const [viewing, setViewing] = useState(null);
  const [adding, setAdding] = useState(null);
  const [linkInput, setLinkInput] = useState("");

  function saveDoc(id, data) {
    const updated = {...docs, [id]: data};
    setDocs(updated);
    try { localStorage.setItem(storageKey, JSON.stringify(updated)); } catch(e){}
  }

  function removeDoc(id) {
    const updated = {...docs};
    delete updated[id];
    setDocs(updated);
    try { localStorage.setItem(storageKey, JSON.stringify(updated)); } catch(e){}
    setViewing(null);
  }

  function handleFileUpload(id, file) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      saveDoc(id, {type:"image", data:ev.target.result, name:file.name, added:new Date().toLocaleDateString()});
      setAdding(null);
    };
    reader.readAsDataURL(file);
  }

  function handleLinkSave(id) {
    if(!linkInput.trim()) return;
    saveDoc(id, {type:"link", url:linkInput.trim(), added:new Date().toLocaleDateString()});
    setLinkInput("");
    setAdding(null);
  }

  // Viewing a doc
  if(viewing) {
    const doc = docs[viewing];
    const docType = DOC_TYPES.find(d=>d.id===viewing);
    return e('div',{style:{display:"flex",flexDirection:"column",gap:"0.75rem"}},
      e('div',{style:{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.25rem"}},
        e('div',{onClick:()=>setViewing(null),style:{cursor:"pointer",color:"var(--muted)",fontSize:"0.9rem"}},"← Back"),
        e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1rem"}},docType.icon+" "+docType.label)
      ),
      doc.type==="image"&&e('img',{src:doc.data,style:{width:"100%",borderRadius:8,border:"1px solid var(--border)"}}),
      doc.type==="link"&&e('div',{style:{background:"var(--panel)",border:"1px solid var(--border)",borderRadius:8,padding:"1rem"}},
        e('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.6rem",color:"var(--muted)",marginBottom:"0.5rem"}},"SAVED LINK"),
        e('div',{style:{fontSize:"0.82rem",color:"var(--trail)",wordBreak:"break-all",marginBottom:"1rem"}},doc.url),
        e('div',{onClick:()=>window.open(doc.url,"_blank"),style:{background:"var(--trail)",color:"var(--void)",borderRadius:6,padding:"0.7rem",textAlign:"center",fontWeight:700,fontSize:"0.8rem",cursor:"pointer"}},"Open Link →")
      ),
      e('div',{style:{fontSize:"0.65rem",color:"var(--muted)",fontFamily:"'Space Mono',monospace"}},"Added: "+doc.added),
      e('div',{onClick:()=>removeDoc(viewing),style:{background:"rgba(240,92,92,0.1)",border:"1px solid rgba(240,92,92,0.3)",color:"var(--red)",borderRadius:6,padding:"0.7rem",textAlign:"center",fontSize:"0.78rem",fontWeight:600,cursor:"pointer",marginTop:"0.5rem"}},"Remove Document")
    );
  }

  // Adding a doc
  if(adding) {
    const docType = DOC_TYPES.find(d=>d.id===adding);
    return e('div',{style:{display:"flex",flexDirection:"column",gap:"0.75rem"}},
      e('div',{style:{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.25rem"}},
        e('div',{onClick:()=>setAdding(null),style:{cursor:"pointer",color:"var(--muted)",fontSize:"0.9rem"}},"← Back"),
        e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1rem"}},docType.icon+" Add "+docType.label)
      ),
      // Upload image
      e('div',{style:{background:"var(--panel)",border:"2px dashed var(--border)",borderRadius:8,padding:"1.5rem",textAlign:"center",cursor:"pointer",position:"relative"},
        onClick:()=>document.getElementById("fileup_"+adding).click()},
        e('div',{style:{fontSize:"2rem",marginBottom:"0.5rem"}},"📷"),
        e('div',{style:{fontSize:"0.82rem",fontWeight:500,marginBottom:"0.25rem"}},"Upload Photo"),
        e('div',{style:{fontSize:"0.68rem",color:"var(--muted)"}},"Take a photo or choose from library"),
        e('input',{id:"fileup_"+adding,type:"file",accept:"image/*",capture:"environment",style:{display:"none"},
          onChange:ev=>handleFileUpload(adding, ev.target.files[0])})
      ),
      e('div',{style:{textAlign:"center",fontSize:"0.68rem",color:"var(--muted)"}},
        "— or paste a link —"
      ),
      e('input',{
        type:"url",
        placeholder:"https://digilocker.gov.in/your-doc-link",
        value:linkInput,
        onChange:ev=>setLinkInput(ev.target.value),
        style:{width:"100%",background:"var(--deep)",border:"1px solid var(--border)",borderRadius:8,
          padding:"0.8rem",color:"var(--white)",fontSize:"0.8rem",fontFamily:"'DM Sans',sans-serif",outline:"none"}
      }),
      e('div',{onClick:()=>handleLinkSave(adding),style:{background:linkInput?"var(--trail)":"rgba(57,232,122,0.2)",color:linkInput?"var(--void)":"var(--muted)",borderRadius:6,padding:"0.75rem",textAlign:"center",fontWeight:700,fontSize:"0.8rem",cursor:linkInput?"pointer":"not-allowed"}},"Save Link")
    );
  }

  // Main documents list
  return e('div',{style:{display:"flex",flexDirection:"column",gap:"0.75rem"}},
    e('div',{style:{background:"linear-gradient(135deg,#1a2b1d,rgba(57,232,122,0.08))",border:"1px solid var(--border)",borderRadius:8,padding:"1rem"}},
      e('div',{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.1rem",marginBottom:"0.3rem"}},"📁 Documents Vault"),
      e('div',{style:{fontSize:"0.75rem",color:"var(--muted)",lineHeight:1.6}},"Store your key documents here. Access them instantly whenever you tap your Rewrapped frame.")
    ),
    e('div',{style:{background:"rgba(240,168,50,0.08)",border:"1px solid rgba(240,168,50,0.2)",borderRadius:8,padding:"0.75rem 1rem",fontSize:"0.72rem",color:"rgba(240,168,50,0.9)",lineHeight:1.6}},
      "🔒 Documents are stored only on this device. Nothing is uploaded to any server."
    ),
    e('div',{style:{display:"flex",flexDirection:"column",gap:"0.5rem"}},
      DOC_TYPES.map(doc=>{
        const saved = docs[doc.id];
        return e('div',{key:doc.id,style:{background:"var(--panel)",border:"1px solid var(--border)",borderRadius:10,padding:"1rem",display:"flex",alignItems:"center",gap:"0.85rem",cursor:"pointer"},
          onClick:()=>saved?setViewing(doc.id):setAdding(doc.id)},
          e('div',{style:{width:42,height:42,borderRadius:10,background:saved?"rgba(57,232,122,0.1)":"rgba(255,255,255,0.04)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.3rem",flexShrink:0}},doc.icon),
          e('div',{style:{flex:1}},
            e('div',{style:{fontWeight:600,fontSize:"0.85rem"}},doc.label),
            e('div',{style:{fontSize:"0.65rem",color:saved?"var(--trail)":"var(--muted)",marginTop:"0.15rem",fontFamily:"'Space Mono',monospace"}},
              saved ? "✓ Saved · "+saved.added : "Tap to add"
            )
          ),
          e('div',{style:{color:saved?"var(--trail)":"var(--muted)",fontSize:"0.9rem"}},saved?"→":"+")
        );
      })
    )
  );
}
function Modal({type,pair,onClose}){
  if(!type||!pair) return null;
  return e('div',{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}},
    e('div',{onClick:ev=>ev.stopPropagation(),style:{background:"var(--panel)",border:"1px solid var(--border)",borderRadius:"14px 14px 0 0",padding:"1.2rem 1.2rem 2.5rem",width:"100%",maxWidth:420,maxHeight:"85vh",overflowY:"auto",animation:"slideUp 0.3s ease"}},
      e('div',{style:{width:32,height:4,borderRadius:2,background:"var(--border)",margin:"0 auto 1rem"}}),
      type==="travel"&&e(TravelReady,{onClose,pair}),
      type==="impact"&&e(ImpactPassport,{pair}),
      e('div',{onClick:onClose,style:{width:"100%",padding:"0.8rem",background:"var(--trail)",color:"var(--void)",borderRadius:6,fontWeight:700,fontSize:"0.82rem",cursor:"pointer",marginTop:"1rem",textAlign:"center"}},"Close")
    )
  );
}

// ---- MAIN APP ----
function App(){
  const params=new URLSearchParams(window.location.search);
  const urlPair=params.get("pair");
  const resolvedId=urlPair&&PAIRS[urlPair]?urlPair:"NV-001";
  const invalid=urlPair&&!PAIRS[urlPair];

  const [pairId]=useState(resolvedId);
  const [tab,setTab]=useState("dashboard");
  const [modal,setModal]=useState(null);
  const [splashDone,setSplashDone]=useState(false);

  if(invalid) return e(NotFound);
  if(!splashDone) return e(Splash,{onDone:()=>setSplashDone(true)});

  const pair=PAIRS[pairId];
  const tabs=[["dashboard","⚡","Home"],["leaderboard","🏆","Board"],["activity","📍","Activity"],["story","🌿","Story"],["sos","🚨","SOS"],["docs","📁","Docs"]];

  return e('div',{style:{background:"var(--void)",minHeight:"100vh",color:"var(--white)",fontFamily:"'DM Sans',sans-serif",display:"flex",flexDirection:"column",animation:"fadeIn 0.5s ease"}},
    e('div',{style:{position:"sticky",top:0,zIndex:50,background:"rgba(8,12,10,0.95)",borderBottom:"1px solid var(--border)",padding:"0.8rem 1rem",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      e('span',{style:{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:"1.05rem",letterSpacing:"-0.03em"}},
        "rewrapped",e('span',{style:{color:"var(--trail)"}}," trail")
      ),
      e('div',{style:{display:"flex",alignItems:"center",gap:"0.5rem"}},
        e('div',{className:"pulse"}),
        e('span',{style:{fontFamily:"'Space Mono',monospace",fontSize:"0.58rem",color:"var(--trail)",background:"var(--trail-dim)",border:"1px solid var(--trail-mid)",padding:"0.2rem 0.5rem",borderRadius:3}},"#"+pairId)
      )
    ),
    e('div',{style:{display:"flex",background:"var(--deep)",borderBottom:"1px solid var(--border)",overflowX:"auto"}},
      tabs.map(([id,icon,label])=>
        e('div',{key:id,onClick:()=>setTab(id),style:{flex:1,minWidth:60,padding:"0.65rem 0.3rem",textAlign:"center",fontSize:"0.65rem",fontWeight:500,color:tab===id?"var(--trail)":"var(--muted)",borderBottom:`2px solid ${tab===id?"var(--trail)":"transparent"}`,cursor:"pointer",whiteSpace:"nowrap"}},
          e('div',{style:{fontSize:"0.95rem"}},icon),label
        )
      )
    ),
    e('div',{style:{flex:1,padding:"1rem",overflowY:"auto"}},
      tab==="dashboard"&&e(Dashboard,{pair,onTile:t=>{if(t==="story")setTab("story");else if(t==="sos")setTab("sos");else setModal(t);}}),
      tab==="leaderboard"&&e(Leaderboard,{currentId:pairId}),
      tab==="activity"&&e(Activity,{pair}),
      tab==="story"&&e(Story,{pair}),
      tab==="sos"&&e(SOS,{pair}),
      tab==="docs"&&e(Documents,{pairId})
    ),
    e(Modal,{type:modal,pair,onClose:()=>setModal(null)})
  );
}

ReactDOM.render(e(App),document.getElementById("root"));
</script>
</body>
</html>
